<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Logo-transparent.png" />
  <link rel="apple-touch-icon" href="/Logo-transparent.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <title>GestArt</title>
  <meta name="description"
    content="GestArt est le meilleur logiciel CRM pour les entreprises de maintenance. Automatisez les rappels SMS, planifiez les interventions de vos techniciens et facturez en 1 clic." />

  <!-- Early theme initialization to prevent flash on reload -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('theme_mode') || (localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
        var isDark = false;
        if (mode === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDark = mode === 'dark';
        }
        if (isDark && window.location.pathname !== '/') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts for Document Customizer, Previews & PDF exports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
