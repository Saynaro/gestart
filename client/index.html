  <!-- Early theme initialization to prevent flash on reload -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('theme_mode') || (localStorage.getItem('theme') === 'dark' ? 'dark' : 'light');
        var isDark = false;
        if (mode === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDark = mode === 'dark';
        }
        if (isDark && window.location.pathname !== '/') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
