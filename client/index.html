  <!-- Early theme initialization to prevent flash on reload -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('theme_mode') || (localStorage.getItem('theme') === 'dark' ? 'dark' : (localStorage.getItem('theme') === 'light' ? 'light' : 'system'));
        var isDark = false;
        if (mode === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDark = mode === 'dark';
        }
        if (isDark && window.location.pathname !== '/') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
    }

    html:not(.dark),
    html:not(.dark) body {
      background-color: #F2F0EB;
    }

    html.dark,
    html.dark body {
      background-color: #0a0a0a;
    }

    /* Prevent black flash under #root before CSS loads */
    #root {
      background-color: #F2F0EB;
      min-height: 100dvh;
    }

    html.dark #root {
      background-color: #0a0a0a;
    }
  </style>
